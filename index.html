<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Poteri inaspettati su YouTube</title>
<meta property="og:title" content="Poteri inaspettati su YouTube">
<meta property="og:description" content="Storie animate di superpoteri. Il protagonista sei tu.">
<meta property="og:image" content="avatar.jpg">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0c26; color: #fff; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, #3b2c86 0, #1a1a4a 45%, #06071a 100%); }
  main { width: 100%; max-width: 380px; padding: 24px 16px; text-align: center; box-sizing: border-box; }
  img { width: 112px; height: 112px; border-radius: 50%; box-shadow: 0 0 0 4px #ffd84f, 0 0 40px #7a5cff; }
  h1 { margin: 18px 0 4px; font-size: 26px; font-weight: 900; letter-spacing: .5px; }
  h1 span { color: #ffd02e; }
  p { margin: 0 0 22px; color: #d9d2ff; }
  a.go { display: block; padding: 16px; border-radius: 14px; background: #ff0033; color: #fff; font-weight: 800; font-size: 18px; text-decoration: none; }
  a.web { display: inline-block; margin-top: 16px; color: #bdb3ff; font-size: 14px; }
  #dbg { margin-top: 20px; font: 12px/1.4 ui-monospace, monospace; text-align: left; word-break: break-all; color: #9ef; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <img src="avatar.jpg" alt="Poteri inaspettati">
  <h1>POTERI <span>INASPETTATI</span></h1>
  <p id="msg">Apro YouTube…</p>
  <a class="go" id="go" href="https://www.youtube.com/@sticklerpower">Apri nell'app YouTube</a>
  <a class="web" id="web" href="https://www.youtube.com/@sticklerpower">oppure continua nel browser</a>
  <div id="dbg" hidden></div>
</main>
<script>
// Open-in-app link for the channel (2026-11-12). Instagram opens links in its own browser, where people are not signed in
// to YouTube; this page hands the visitor to the YouTube app instead.
//   ?v=<11-char video id>  opens that video, otherwise the channel · ?debug=1 shows the URLs and does not redirect.
// Android: an intent:// URL for the YouTube app with the web page as fallback. iPhone/iPad: the app's youtube:// scheme
// (tried on load, and again on the button, since iOS may only allow it after a tap). Computers: straight to youtube.com.
(function () {
  // ?sub_confirmation=1 asks the visitor to subscribe when the channel opens (shown on the web; ignored where unsupported)
  var CHANNEL = 'https://www.youtube.com/@sticklerpower?sub_confirmation=1';
  var q = new URLSearchParams(location.search);
  var m = /^[A-Za-z0-9_-]{11}$/.exec(q.get('v') || '');
  var web = m ? 'https://www.youtube.com/watch?v=' + m[0] : CHANNEL;
  var rest = web.replace('https://www.youtube.com/', '');
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var app = android
    ? 'intent://www.youtube.com/' + rest + '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent(web) + ';end'
    : ios ? (m ? 'vnd.youtube://' + m[0] : 'youtube://www.youtube.com/' + rest) : web; // a video: the documented vnd.youtube://<id>
  document.getElementById('go').href = app;
  document.getElementById('web').href = web;
  if (q.get('debug')) {
    var d = document.getElementById('dbg'); d.hidden = false;
    d.textContent = 'device: ' + (android ? 'android' : ios ? 'ios' : 'other') + '\napp: ' + app + '\nweb: ' + web + '\nua: ' + ua;
    document.getElementById('msg').textContent = 'Debug: nessun reindirizzamento.';
    return;
  }
  if (!android && !ios) { location.replace(web); return; }
  setTimeout(function () { location.href = app; }, 60);
  setTimeout(function () { if (!document.hidden) document.getElementById('msg').textContent = 'Se YouTube non si è aperto, tocca il pulsante.'; }, 1500);
})();
</script>
</body>
</html>
